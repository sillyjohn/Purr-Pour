server.port=${COFFEE_PORT:8091}
server.address=${COFFEE_BIND:127.0.0.1}
server.error.include-message=never
spring.application.name=purr-and-pour
spring.datasource.url=${COFFEE_JDBC_URL}
spring.datasource.username=${COFFEE_DB_USER}
spring.datasource.password=${COFFEE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.async.request-timeout=1800000
logging.level.root=INFO
server.shutdown=graceful
